services:
  - type: web
    name: face-attendance
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
