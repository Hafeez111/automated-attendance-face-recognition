services:
  - type: web
    name: face-attendance
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
